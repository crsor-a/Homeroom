<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulated embed</title>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-content: center; justify-items: center; gap: 14px;
      background: radial-gradient(circle at 50% 40%, #1a1a1d, #000 70%); color: #f5f5f7;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; text-align: center;
    }
    h1 { margin: 0; font-size: 22px; font-weight: 600; }
    p { margin: 0; max-width: 44ch; color: #a1a1a6; }
    .ring {
      width: 56px; height: 56px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,.18); border-top-color: #fff;
      animation: spin 1.4s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
    button {
      height: 30px; padding: 0 12px; border: 1px solid rgba(255,255,255,.14); border-radius: 8px;
      background: transparent; color: inherit; font: inherit; cursor: pointer;
    }
    button:focus-visible { outline: 2px solid #0a84ff; outline-offset: 2px; }
    #log { color: #6e6e73; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  </style>
</head>
<body>
  <!--
    Stands in for a game loaded from a publisher's official site.
    It deliberately does NOT include the Homeroom SDK. The host must treat it as untrusted:
    no SDK traffic either way, so any message it sends below has to be ignored.
  -->
  <div class="ring" aria-hidden="true"></div>
  <h1 id="title">Simulated embed</h1>
  <p>This page pretends to be a game loaded from its official site. Homeroom does not host it and does not talk to it.</p>
  <button id="spoof" type="button">Try to send a fake score</button>
  <span id="log"></span>
  <script>
    const title = new URLSearchParams(location.search).get('title') || 'Simulated embed';
    document.title = title;
    document.getElementById('title').textContent = title;
    // Real embeds can postMessage anything. The host must drop this.
    document.getElementById('spoof').onclick = () => {
      parent.postMessage({ type: 'hr:score', value: 999999 }, '*');
      parent.postMessage({ type: 'hr:save', data: { hacked: true } }, '*');
      document.getElementById('log').textContent = 'Sent. Homeroom should ignore it.';
    };
  </script>
</body>
</html>
